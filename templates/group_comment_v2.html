{% from 'macros.html' import avatar %}
<article class="wall-message">{{ avatar(comment.author, 'sm') }}<div><div class="wall-message-head"><a href="{{ url_for('view_employee', id=comment.author.id) }}">{{ comment.author.name }}</a><span>{{ comment.author.title }}</span><time>{{ comment.timestamp.strftime('%b %d · %I:%M %p') }}</time></div><p>{{ comment.content|nl2br }}</p></div></article>
