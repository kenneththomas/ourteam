<!DOCTYPE html>
<html>
<head>
    <title>IM Conversation Simulation</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { width: 80%; margin: auto; padding: 20px; background: #fff; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; }
        .conversation-window {
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .message strong {
            color: #333;
            margin-right: 5px;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 10px;
        }
        .simulate-section, .manual-section {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background: #eee;
        }
        button {
            padding: 8px 12px;
            margin-right: 10px;
            cursor: pointer;
        }
        select {
            padding: 8px;
            margin-bottom: 10px;
            width: 200px;
        }
        #gptEngine {
            background-color: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container">
        <h1>IM Conversation Simulation</h1>
        
        <!-- Add the GPT engine selector -->
        <div class="form-group">
            <label for="gptEngine">GPT Engine:</label>
            <select id="gptEngine" name="gptEngine">
                <option value="gpt-4o-mini">GPT-4O Mini (Faster)</option>
                <option value="gpt-4o">GPT-4O (Higher Quality)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="coworkerA_input">Coworker A:</label>
            <input type="text" id="coworkerA_input" placeholder="Type to search coworker A">
            <input type="hidden" id="coworkerA" name="coworkerA">
            <input type="hidden" id="coworkerA_picture" name="coworkerA_picture">
        </div>
        <div class="form-group">
            <label for="coworkerB_input">Coworker B:</label>
            <input type="text" id="coworkerB_input" placeholder="Type to search coworker B">
            <input type="hidden" id="coworkerB" name="coworkerB">
            <input type="hidden" id="coworkerB_picture" name="coworkerB_picture">
        </div>
        <div class="form-group">
            <label for="situationContext">Situation Context:</label>
            <textarea id="situationContext" name="situationContext" rows="4" placeholder="Enter a brief context of the conversation..."></textarea>
        </div>
        <div class="form-group">
            <label for="gptPrompt">GPT Prompt (Editable):</label>
            <textarea id="gptPrompt" name="gptPrompt" rows="8" placeholder="Preview and edit the GPT prompt here..."></textarea>
            <button id="previewPrompt" type="button">Preview GPT Prompt</button>
        </div>
        
        <div class="conversation-window" id="conversationWindow">
            <!-- Chat messages will appear here -->
        </div>
        
        <div class="simulate-section">
            <h2>Simulate Reply</h2>
            <button id="simulateReplyA">Simulate Reply as Coworker A</button>
            <button id="simulateReplyB">Simulate Reply as Coworker B</button>
        </div>
        
        <div class="manual-section">
            <h2>Manual Message</h2>
            <div class="form-group">
                <label for="manualSender">Sender:</label>
                <select id="manualSender" name="manualSender">
                    <option value="A">Coworker A</option>
                    <option value="B">Coworker B</option>
                </select>
            </div>
            <div class="form-group">
                <label for="manualMessage">Message:</label>
                <textarea id="manualMessage" name="manualMessage" rows="2" placeholder="Type your message here..."></textarea>
            </div>
            <button id="sendManualMessage">Send Manual Message</button>
        </div>
    </div>
    
    <script>
        function appendMessage(senderName, senderImage, messageText) {
            var messageHtml = '<div class="message">';
            if (senderImage) {
                messageHtml += '<img class="profile-img" src="' + senderImage + '" alt="Profile Image">';
            }
            messageHtml += '<div>';
            messageHtml += '<strong>' + senderName + ':</strong> <span class="text">' + messageText + '</span>';
            messageHtml += '</div></div>';
            $("#conversationWindow").append(messageHtml);
            $("#conversationWindow").scrollTop($("#conversationWindow")[0].scrollHeight);
        }

        $(document).ready(function() {
            $("#coworkerA_input").autocomplete({
                source: "/autocomplete_employee",
                minLength: 2,
                select: function(event, ui) {
                    $("#coworkerA_input").val(ui.item.label);
                    $("#coworkerA").val(ui.item.value);
                    $("#coworkerA_picture").val(ui.item.picture);
                    return false;
                }
            });
            
            $("#coworkerB_input").autocomplete({
                source: "/autocomplete_employee",
                minLength: 2,
                select: function(event, ui) {
                    $("#coworkerB_input").val(ui.item.label);
                    $("#coworkerB").val(ui.item.value);
                    $("#coworkerB_picture").val(ui.item.picture);
                    return false;
                }
            });

            $("#previewPrompt").click(function() {
                var coworkerAId = $("#coworkerA").val();
                var coworkerBId = $("#coworkerB").val();
                var context = $("#situationContext").val();
                var conversation = $("#conversationWindow").text();
                $.ajax({
                    type: "POST",
                    url: "/get_im_prompt_preview",
                    data: {
                        'from': coworkerAId,
                        'to': coworkerBId,
                        'context': context,
                        'conversation': conversation
                    },
                    success: function(response) {
                        $("#gptPrompt").val(response.prompt);
                    },
                    error: function() {
                        alert("Error generating prompt preview.");
                    }
                });
            });

            $("#simulateReplyA").click(function() {
                var coworkerAId = $("#coworkerA").val();
                var coworkerBId = $("#coworkerB").val();
                var context = $("#situationContext").val();
                var conversation = $("#conversationWindow").text();
                var customPrompt = $("#gptPrompt").val();
                $.ajax({
                    type: "POST",
                    url: "/generate_im_message",
                    data: {
                        'from': coworkerAId,
                        'to': coworkerBId,
                        'context': context,
                        'conversation': conversation,
                        'custom_prompt': customPrompt
                    },
                    success: function(response) {
                        var senderImg = $("#coworkerA_picture").val();
                        var senderName = $("#coworkerA_input").val();
                        appendMessage(senderName, senderImg, response.generated_message);
                    },
                    error: function() {
                        alert("Error generating message.");
                    }
                });
            });

            $("#simulateReplyB").click(function() {
                var coworkerAId = $("#coworkerA").val();
                var coworkerBId = $("#coworkerB").val();
                var context = $("#situationContext").val();
                var conversation = $("#conversationWindow").text();
                var customPrompt = $("#gptPrompt").val();
                $.ajax({
                    type: "POST",
                    url: "/generate_im_message",
                    data: {
                        'from': coworkerBId,
                        'to': coworkerAId,
                        'context': context,
                        'conversation': conversation,
                        'custom_prompt': customPrompt
                    },
                    success: function(response) {
                        var senderImg = $("#coworkerB_picture").val();
                        var senderName = $("#coworkerB_input").val();
                        appendMessage(senderName, senderImg, response.generated_message);
                    },
                    error: function() {
                        alert("Error generating message.");
                    }
                });
            });

            $("#sendManualMessage").click(function() {
                var senderType = $("#manualSender").val();
                var message = $("#manualMessage").val();
                var senderName = "";
                var senderImg = "";
                if (senderType == "A") {
                    senderName = $("#coworkerA_input").val();
                    senderImg = $("#coworkerA_picture").val();
                } else {
                    senderName = $("#coworkerB_input").val();
                    senderImg = $("#coworkerB_picture").val();
                }
                if (message.trim() !== "") {
                    appendMessage(senderName, senderImg, message);
                    $("#manualMessage").val("");
                }
            });
        });
    </script>
</body>
</html>
